[project]
name = "allegro-mcp-server"
version = "0.1.1"
description = "MCP server for the Allegro REST API: offers, orders, billing and ads"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Zięba" }]
requires-python = ">=3.10"
keywords = ["mcp", "allegro", "model-context-protocol", "ecommerce", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",        # server API of mcp 2.x; also covers CVE-2025-53365/53366/66416
    "python-dotenv>=1.2.2", # CVE-2026-28684 (symlink in set_key/unset_key)
    # Security floors for transitive dependencies pulled in by mcp.
    "starlette>=1.3.1",          # CVE-2026-54283/48818/48710/48817/54282
    "python-multipart>=0.0.32",  # CVE-2026-53539/42561/40347/53537/53538/53540
    "pyjwt>=2.13.0",             # CVE-2026-32597/48526/48522/48523/48525/48524
    "pydantic-settings>=2.14.2", # CVE-2026-58203
    "idna>=3.15",                # CVE-2026-45409
    "cryptography>=50.0.0",      # GHSA-g6cj-pr64-35w5, GHSA-537c-gmf6-5ccf
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
allegro-mcp-server = "allegro_mcp.server:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allegro_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
